name: Create rfsuite-lua-edgetx ZIP on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  msp-setup-apis:
    name: MSP setup APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_setup_apis.lua

  helicopter-wizard:
    name: Helicopter wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/wizard/verify.lua
      - run: python3 bin/wizard/audit_source.py
      - run: python3 bin/wizard/flow.py --check
      - run: python3 bin/wizard/verify_negative.py --lua lua5.3

  create-zip:
    name: Build PR ZIP (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with push.yml / release.yml / snapshot.yml
        lang: [en, de]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set build variables (PR version)
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV

      - name: Create rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}.zip
        run: |
          python bin/package/build_package.py \
            --lang '${{ matrix.lang }}' \
            --artifact-version '${{ env.GIT_VER }}' \
            --output-dir .

      - name: Upload per-locale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}
          path: rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}.zip
          if-no-files-found: error

  instruction-budget:
    name: Instruction budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the gate can go red
        run: lua5.3 bin/accounting/measure.lua --self-test

      - name: Account instructions per pass
        run: lua5.3 bin/accounting/measure.lua --check

      - name: In-flight trim routing
        run: lua5.3 bin/dashboard/verify_inflight_trims.lua

  startup-compile:
    # The configuration tool compiles the installed suite at start (src/rfsuite/lib/precompile.lua).
    # This runs the real module on an in-memory card across consecutive starts: a fresh install
    # without a user folder, a stamp that cannot be written, macOS metadata files beside the
    # sources and a source that does not compile.
    name: Start-up compile pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check consecutive starts reuse the compiled suite
        run: lua5.3 bin/package/verify_precompile.lua

  i18n-precompiler:
    name: i18n precompiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the checks can go red
        run: python .vscode/scripts/test_precompile_i18n.py --self-test

      - name: Precompile one page and compare
        run: python .vscode/scripts/test_precompile_i18n.py

  documentation-rule:
    name: Documentation rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the check can go red
        run: python bin/docs/verify_documentation_rule.py --self-test

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the documentation rule
        run: |
          python bin/docs/verify_documentation_rule.py             --base '${{ github.event.pull_request.base.sha }}'             --body-file pr-body.txt

  menu-structure:
    # docs/reference/menu-structure.md is generated from the menu definition, the page
    # registry, the English titles and the files under docs/pages/. A change to any of them
    # that does not regenerate the page turns this red; `python3 bin/docs/menu_structure.py`
    # writes it.
    name: Menu structure page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the check can go red
        run: python3 bin/docs/menu_structure.py --self-test

      - name: Check the page matches the menu definition
        run: python3 bin/docs/menu_structure.py --check

  translation-coverage:
    name: Translation coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the check can go red
        run: python bin/i18n/check_translations.py --self-test

      - name: Report the strings a locale build cannot translate
        run: python bin/i18n/check_translations.py

  i18n-resolver:
    # Added because a resolver self-test that only ran in checks.yml reached
    # master broken: the restore of the read-only case chmod-ed back to
    # stat.S_IWRITE, which on POSIX leaves the file --w------- with no read
    # bit, so the self-test's own read-back raised. It passed on Windows,
    # where the same call only toggles the read-only attribute, and pr.yml did
    # not run the step -- so the first run on any push was the failing one.
    # A gate nobody watches on a pull request is not known to be a gate.
    name: i18n resolver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the resolver can report a failure
        run: python .vscode/scripts/resolve_i18n_tags.py --self-test

  erase-confirmation:
    # The quick menu's ERASE BLACKBOX is irreversible and one tap from the flight line. The
    # row carries a `confirm` and M.run holds its press behind it; this proves the whole path
    # offline, and its self-test proves the checks go red for a row that erases without asking.
    name: Erase confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_erase_confirm.lua --self-test

      - name: Check the erase asks before it erases
        run: lua5.3 bin/dashboard/verify_erase_confirm.lua

  esc-wiring-detection:
    # Setup > ESC & Motors > Telemetry drives the flight controller's wiring trial. This runs
    # the real page against scripted replies: lifecycle, locking, Cancel, stale replies and a
    # result left in the flight controller by an earlier run.
    name: ESC wiring detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check the wiring detection page lifecycle
        run: lua5.3 bin/msp/verify_esc_wiring_trial.lua

  dashboard-fullscreen-keys:
    name: Dashboard fullscreen keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_fullscreen_keys.lua --self-test

      - name: Check global and theme key resolution
        run: lua5.3 bin/dashboard/verify_fullscreen_keys.lua

  dashboard-theme-global-keys:
    name: Dashboard theme global keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_theme_global_keys.lua --self-test

      - name: Check the theme Keys pages against the global keys
        run: lua5.3 bin/dashboard/verify_theme_global_keys.lua

  dashboard-voltage:
    name: Dashboard regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check automatic and saved voltage bounds
        run: |
          lua5.3 bin/dashboard/verify_voltage_bounds.lua
          lua5.3 bin/themes/verify_voltage_save.lua
          lua5.3 bin/dashboard/verify_offline_theme_settings.lua

      - name: Check per-model reset rollback
        run: lua5.3 bin/dashboard/verify_overrides_reset.lua

      - name: Check dashboard tile choices and theme key pages
        run: lua5.3 bin/dashboard/verify_field_choices.lua

      - name: Check dashboard standby geometry and formatting
        run: lua5.3 bin/dashboard/verify_standby.lua

      - name: Check dashboard standby integration
        run: lua5.3 bin/tests/dashboard_standby_integration_test.lua

      - name: Check shared ELRS configuration reads
        run: lua5.3 bin/tests/elrs_config_test.lua

      - name: Check ELRS diagnostics ownership gate
        run: lua5.3 bin/tests/elrs_diagnostics_gate_test.lua

  board-auto-align:
    # Setup > Alignment drives the flight controller's board auto-alignment. This runs the
    # real page against scripted replies: lifecycle, locking, stale replies, the signed Save
    # payload and a result left in the flight controller by an earlier run.
    name: Board auto-alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check the auto-alignment API
        run: lua5.3 bin/msp/verify_board_auto_align.lua

      - name: Check the auto-alignment page lifecycle
        run: lua5.3 bin/msp/verify_board_auto_align_page.lua

  smartfuel-validity:
    name: SmartFuel estimate validity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check invalid inputs and recovery
        run: |
          lua5.3 bin/smartfuel/verify_invalid_max.lua
          lua5.3 bin/smartfuel/verify_readers.lua

      - name: Check the combined source
        run: lua5.3 bin/smartfuel/verify_combined_source.lua

  flight-record-absent-sources:
    name: Flight record absent sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check absent sources and dashboard statistics
        run: lua5.3 bin/telemetry/verify_flight_record_absent.lua

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the checks can go red
        run: |
          python bin/release/collect_release_notes.py --self-test
          python bin/release/verify_release_notes_rule.py --self-test

      - name: Check the pending release notes
        run: python bin/release/collect_release_notes.py --check

  release-notes-rule:
    name: Release notes rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the release notes rule
        run: |
          python bin/release/verify_release_notes_rule.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --body-file pr-body.txt

  packed-system-state:
    name: Live packed system state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check fields, freshness and negative control
        run: lua5.3 bin/telemetry/verify_system_state.lua --self-test

  msp-override-payloads:
    name: MSP override payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_override_payloads.lua

  esc-parameters-pack:
    name: ESC parameter byte packing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_esc_parameters_pack.lua
      - run: lua5.3 bin/msp/verify_esc_readback_after_save.lua
      - run: lua5.3 bin/ui/verify_confirm_dialog_no_retain.lua

  esc-yge-flag-bit3:
    name: YGE flags bit 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/esc/verify_yge_flag_bit3.lua

  flight-tuning-pids-governor-saves:
    name: Flight Tuning saves (PIDs, Governor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/flight_tuning/verify_save_pids_governor_pages.lua

  flight-tuning-rescue-filters-saves:
    name: Flight Tuning saves (Rescue, Filters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/flight_tuning/verify_save_rescue_filters_pages.lua

  flight-tuning-rates-saves:
    name: Flight Tuning saves (Rates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/flight_tuning/verify_save_rates_pages.lua

  flight-tuning-tail-rotor-saves:
    name: Flight Tuning saves (Tail Rotor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/flight_tuning/verify_save_tail_rotor_page.lua

  msp-refused-error:
    name: MSP refused and silent boards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_refused_error.lua

  flight-tuning-saves:
    name: Flight Tuning saves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/flight_tuning/verify_save_pid_profile_pages.lua

  msp-armed-state:
    name: MSP armed state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_armed_state.lua

  diagnostic-logs:
    name: Diagnostic logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/tests/verify_log_runs.lua

  model-template:
    name: Model template wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/templates/verify_rotorflight_template.lua

  logs-viewer:
    name: Logs viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/logs/verify_graph_stop.lua
      - run: lua5.3 bin/logs/verify_logs_page.lua

name: Create rfsuite-lua-edgetx ZIP on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # The gates measure the tree they are given, so they are one list in checks.yml.
  # The jobs below are the ones only a pull request can run: the archives named after
  # its number, and the rules that read its body.
  gates:
    name: Gates
    uses: ./.github/workflows/checks.yml

  create-zip:
    name: Build PR ZIP (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with push.yml / release.yml / snapshot.yml
        lang: [en, de]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set build variables (PR version)
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV

      - name: Create rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}.zip
        run: |
          python bin/package/build_package.py \
            --lang '${{ matrix.lang }}' \
            --artifact-version '${{ env.GIT_VER }}' \
            --output-dir .

      - name: Upload per-locale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}
          path: rfsuite-radio-install-v${{ env.GIT_VER }}_${{ matrix.lang }}.zip
          if-no-files-found: error

  documentation-rule:
    name: Documentation rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the check can go red
        run: python bin/docs/verify_documentation_rule.py --self-test

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the documentation rule
        run: |
          python bin/docs/verify_documentation_rule.py             --base '${{ github.event.pull_request.base.sha }}'             --body-file pr-body.txt

  release-notes-rule:
    name: Release notes rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the release notes rule
        run: |
          python bin/release/verify_release_notes_rule.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --body-file pr-body.txt


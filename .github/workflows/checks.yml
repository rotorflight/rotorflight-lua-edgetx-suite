name: Gates

# The checks that decide whether a build may ship. Called by the workflows that
# publish, so a release tag or a direct push to master runs the same gates a pull
# request does instead of going straight from checkout to artefact.
#
# pr.yml still carries its own copy of these jobs. It is the gate that has been
# protecting master so far, and rewriting it belongs in its own change -- but that
# does mean a check added here has to be added there too, which is the same
# "keep in sync" convention that let an untranslated artefact through in the first
# place. Worth collapsing; not worth doing in the same commit as a fix.
#
# No inputs: every gate below measures the tree it is given, so a caller that
# passes a base and a body was carrying two arguments nothing read. The
# documentation rule that did read a body moved to pr.yml, and the reason is on
# the comment where its job used to be.

on:
  workflow_call:

jobs:
  msp-setup-apis:
    name: MSP setup APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_setup_apis.lua

  helicopter-wizard:
    name: Helicopter wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/wizard/verify.lua
      - run: python3 bin/wizard/audit_source.py
      - run: python3 bin/wizard/verify_negative.py --lua lua5.3

  instruction-budget:
    name: Instruction budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the gate can go red
        run: lua5.3 bin/accounting/measure.lua --self-test

      - name: Account instructions per pass
        run: lua5.3 bin/accounting/measure.lua --check

      - name: In-flight trim routing
        run: lua5.3 bin/dashboard/verify_inflight_trims.lua

  startup-compile:
    # The configuration tool compiles the installed suite at start (src/rfsuite/lib/precompile.lua).
    # This runs the real module on an in-memory card across consecutive starts: a fresh install
    # without a user folder, a stamp that cannot be written, macOS metadata files beside the
    # sources and a source that does not compile.
    name: Start-up compile pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check consecutive starts reuse the compiled suite
        run: lua5.3 bin/package/verify_precompile.lua

  i18n-precompiler:
    name: i18n precompiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the checks can go red
        run: python .vscode/scripts/test_precompile_i18n.py --self-test

      - name: Precompile one page and compare
        run: python .vscode/scripts/test_precompile_i18n.py

  i18n-resolver:
    name: i18n resolver exit status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The packager runs the resolver with check=True, so an exit status that
      # cannot report a failure means a failed i18n stage ships quietly.
      - name: Prove the exit status can go red
        run: python .vscode/scripts/resolve_i18n_tags.py --self-test

  # The documentation rule is deliberately NOT a job here, though this file
  # used to carry it. That rule can be satisfied by a "Documentation:" line in
  # the *pull request* body, and a push or a tag has no such body: push.yml
  # passes only `base`, release.yml and snapshot.yml pass nothing, so the body
  # input arrives empty and the rule falls back to demanding a file under
  # docs/. Measured over the last 15 commits on master, that fails 7 of them --
  # and all three of snapshot/0.1.4, 0.1.5 and 0.1.6 are among the shape that
  # fails, each changing src/ and no docs/. So keeping the job here meant the
  # merge that introduced it would have stopped a release tag on any such
  # commit. The rule belongs to pr.yml, which is the only place that has a body
  # to offer; it is a rule about what a change claims, not about what a tree
  # looks like.

  translation-coverage:
    name: Translation coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the check can go red
        run: python bin/i18n/check_translations.py --self-test

      - name: Report the strings a locale build cannot translate
        run: python bin/i18n/check_translations.py

  erase-confirmation:
    # The quick menu's ERASE BLACKBOX is irreversible and one tap from the flight line. The
    # row carries a `confirm` and M.run holds its press behind it; this proves the whole path
    # offline, and its self-test proves the checks go red for a row that erases without asking.
    # It measures the tree, so it runs on a push or a tag as well as on a pull request -- the
    # same reason the instruction-budget gate above is in both files.
    name: Erase confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_erase_confirm.lua --self-test

      - name: Check the erase asks before it erases
        run: lua5.3 bin/dashboard/verify_erase_confirm.lua

  esc-wiring-detection:
    # Setup > ESC & Motors > Telemetry drives the flight controller's wiring trial. This runs
    # the real page against scripted replies: lifecycle, locking, Cancel, stale replies and a
    # result left in the flight controller by an earlier run.
    # It measures the tree, so it runs on a push or a tag as well as on a pull request.
    name: ESC wiring detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check the wiring detection page lifecycle
        run: lua5.3 bin/msp/verify_esc_wiring_trial.lua

  dashboard-fullscreen-keys:
    name: Dashboard fullscreen keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_fullscreen_keys.lua --self-test

      - name: Check global and theme key resolution
        run: lua5.3 bin/dashboard/verify_fullscreen_keys.lua

  dashboard-theme-global-keys:
    name: Dashboard theme global keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Prove the checks can go red
        run: lua5.3 bin/dashboard/verify_theme_global_keys.lua --self-test

      - name: Check the theme Keys pages against the global keys
        run: lua5.3 bin/dashboard/verify_theme_global_keys.lua

  dashboard-voltage:
    name: Dashboard regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check automatic and saved voltage bounds
        run: |
          lua5.3 bin/dashboard/verify_voltage_bounds.lua
          lua5.3 bin/themes/verify_voltage_save.lua
          lua5.3 bin/dashboard/verify_offline_theme_settings.lua

      - name: Check dashboard standby geometry and formatting
        run: lua5.3 bin/dashboard/verify_standby.lua

      - name: Check dashboard standby integration
        run: lua5.3 bin/tests/dashboard_standby_integration_test.lua

      - name: Check shared ELRS configuration reads
        run: lua5.3 bin/tests/elrs_config_test.lua

      - name: Check ELRS diagnostics ownership gate
        run: lua5.3 bin/tests/elrs_diagnostics_gate_test.lua

  board-auto-align:
    # Setup > Alignment drives the flight controller's board auto-alignment. This runs the
    # real page against scripted replies: lifecycle, locking, stale replies, the signed Save
    # payload and a result left in the flight controller by an earlier run.
    # It measures the tree, so it runs on a push or a tag as well as on a pull request.
    name: Board auto-alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check the auto-alignment API
        run: lua5.3 bin/msp/verify_board_auto_align.lua

      - name: Check the auto-alignment page lifecycle
        run: lua5.3 bin/msp/verify_board_auto_align_page.lua

  smartfuel-validity:
    name: SmartFuel estimate validity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check invalid inputs and recovery
        run: |
          lua5.3 bin/smartfuel/verify_invalid_max.lua
          lua5.3 bin/smartfuel/verify_readers.lua

  flight-record-absent-sources:
    name: Flight record absent sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Check absent sources and dashboard statistics
        run: lua5.3 bin/telemetry/verify_flight_record_absent.lua

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the checks can go red
        run: |
          python bin/release/collect_release_notes.py --self-test
          python bin/release/verify_release_notes_rule.py --self-test

      - name: Check the pending release notes
        run: python bin/release/collect_release_notes.py --check

  packed-system-state:
    name: Live packed system state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check fields, freshness and negative control
        run: lua5.3 bin/telemetry/verify_system_state.lua --self-test

  msp-override-payloads:
    name: MSP override payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_msp_override_payloads.lua

  esc-parameters-pack:
    name: ESC parameter byte packing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 bin/msp/verify_esc_parameters_pack.lua
